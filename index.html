<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whimsical Name Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result.show {
            display: block;
        }

        .result-label {
            color: white;
            font-size: 1.1em;
            margin-bottom: 20px;
            opacity: 0.95;
            font-weight: 600;
        }

        .result-info {
            color: white;
            font-size: 0.9em;
            margin-bottom: 15px;
            opacity: 0.85;
            font-style: italic;
        }

        .result-option {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            margin: 10px 0;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
        }

        .result-option:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateX(5px);
        }

        .result-option:active {
            transform: translateX(5px) scale(0.98);
        }

        .result-option.copied {
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .result-option::after {
            content: 'Click to copy';
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8em;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: rgba(255, 255, 255, 0.7);
        }

        .result-option:hover::after {
            opacity: 1;
        }

        .result-option.copied::after {
            content: '✓ Copied!';
            opacity: 1;
            color: white;
        }

        .result-name {
            color: white;
            font-size: 1.8em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        footer {
            margin-top: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.75em;
        }

        footer a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
        }

        footer a:hover {
            color: white;
        }

        .sparkle {
            display: inline-block;
            animation: sparkle 1.5s infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .error {
            color: #f5576c;
            margin-top: 10px;
            font-size: 0.9em;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>

            noun: ['Wonder', 'Magic', 'Marvel', 'Treasure', 'Sparkle', 'Dream', 'Star', 'Gem',

        // Helper function to get word from dictionary based on type (adj/noun)
        function getWord(prefix, type) {
            const dict = whimsicalDictionary[prefix];

            // Try direct lookup first
            if (dict) {
                // Handle new format {adj: [...], noun: [...]}
                if (dict.adj && dict.noun) {
                    const words = dict[type] || dict.noun;
                    return words[Math.floor(Math.random() * words.length)];
                }

                // Handle old format (array) - treat as both adj and noun
                if (Array.isArray(dict)) {
                    return dict[Math.floor(Math.random() * dict.length)];
                }
            }

            // Try phonetic fallbacks for rare combinations
            if (phoneticFallbacks[prefix]) {
                const fallbackPrefixes = phoneticFallbacks[prefix];
                for (const fallbackPrefix of fallbackPrefixes) {
                    const fallbackDict = whimsicalDictionary[fallbackPrefix];
                    if (fallbackDict) {
                        if (fallbackDict.adj && fallbackDict.noun) {
                            const words = fallbackDict[type] || fallbackDict.noun;
                            return words[Math.floor(Math.random() * words.length)];
                        }
                        if (Array.isArray(fallbackDict)) {
                            return fallbackDict[Math.floor(Math.random() * fallbackDict.length)];
                        }
                    }
                }
            }

            // Try all prefixes starting with the same first letter (e.g., k* for 'kz')
            const firstLetter = prefix.charAt(0);
            const matchingWords = [];

            for (const key in whimsicalDictionary) {
                if (key.charAt(0) === firstLetter) {
                    const candidateDict = whimsicalDictionary[key];

                    if (candidateDict.adj && candidateDict.noun) {
                        const words = candidateDict[type] || candidateDict.noun;
                        matchingWords.push(...words);
                    } else if (Array.isArray(candidateDict)) {
                        matchingWords.push(...candidateDict);
                    }
                }
            }

            if (matchingWords.length > 0) {
                return matchingWords[Math.floor(Math.random() * matchingWords.length)];
            }

            // Last resort: use generic whimsical words
            const genericWords = genericWhimsical[type] || genericWhimsical.noun;
            return genericWords[Math.floor(Math.random() * genericWords.length)];
        }

        function generateWhimsicalName() {
            const input = document.getElementById('nameInput').value.trim();
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            const resultNames = document.getElementById('resultNames');

            // Validate input (allow hyphens now)
            if (!input || !/^[a-zA-Z\s-]+$/.test(input)) {
                error.classList.add('show');
                result.classList.remove('show');
                return;
            }

            error.classList.remove('show');

            // Split input into words, preserving structure
            const words = input.split(/\s+/).filter(word => word.length > 0);

            // Define grammatical patterns for 2-word names
            const twoWordPatterns = [
                ['adj', 'noun'],   // Magnificent Dragon
                ['noun', 'noun']    // Marshmallow Dodger (subject-object)
            ];

            // Generate 5 different whimsical name options
            const options = [];
            const maxAttempts = 100;
            let attempts = 0;

            while (options.length < 5 && attempts < maxAttempts) {
                attempts++;

                // For 2-word names, randomly pick a pattern
                const pattern = words.length === 2
                    ? twoWordPatterns[Math.floor(Math.random() * twoWordPatterns.length)]
                    : null;

                const whimsicalParts = words.map((word, index) => {
                    // Handle hyphenated words like "Mary-Jane"
                    if (word.includes('-')) {
                        const parts = word.split('-');
                        const transformedParts = parts.map((part, partIndex) => {
                            const prefix = part.substring(0, 2).toLowerCase();
                            // For hyphenated parts, use adj for first part, noun for second
                            const type = partIndex === 0 ? 'adj' : 'noun';
                            const newWord = getWord(prefix, type);
                            return newWord || part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
                        });
                        return transformedParts.join('-');
                    }

                    // Regular word handling
                    const prefix = word.substring(0, 2).toLowerCase();

                    // Determine type based on position and pattern
                    let type;
                    if (pattern) {
                        // Use the pattern for 2-word names
                        type = pattern[index];
                    } else {
                        // For 3+ words: all but last are adjectives, last is noun
                        type = index === words.length - 1 ? 'noun' : 'adj';
                    }

                    const newWord = getWord(prefix, type);
                    return newWord || word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                });

                const fullName = whimsicalParts.join(' ');

                // Only add if it's unique
                if (!options.includes(fullName)) {
                    options.push(fullName);
                }
            }

            // Display results with helpful info
            const resultInfo = document.getElementById('resultInfo');
            resultNames.innerHTML = '';

            // Show info message if we couldn't generate 5 unique options
            if (options.length < 5) {
                resultInfo.textContent = `Generated ${options.length} unique option${options.length !== 1 ? 's' : ''} (limited by word combinations available)`;
                resultInfo.style.display = 'block';
            } else {
                resultInfo.style.display = 'none';
            }

            options.forEach(option => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'result-option';
                optionDiv.innerHTML = `<div class="result-name">${option}</div>`;

                // Add click-to-copy functionality
                optionDiv.addEventListener('click', function() {
                    // Copy to clipboard
                    navigator.clipboard.writeText(option).then(() => {
                        // Visual feedback
                        optionDiv.classList.add('copied');

                        // Remove feedback after 2 seconds
                        setTimeout(() => {
                            optionDiv.classList.remove('copied');
                        }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy:', err);
                    });
                });

                resultNames.appendChild(optionDiv);
            });

            result.classList.add('show');
        }

        // Allow Enter key to submit
        document.getElementById('nameInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                generateWhimsicalName();
            }
        });
