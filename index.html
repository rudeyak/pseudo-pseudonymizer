<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Whimsical Name Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1.1em;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 15px;
            text-align: center;
            display: none;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result.show {
            display: block;
        }

        .result-label {
            color: white;
            font-size: 1em;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .result-name {
            color: white;
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .sparkle {
            display: inline-block;
            animation: sparkle 1.5s infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .error {
            color: #f5576c;
            margin-top: 10px;
            font-size: 0.9em;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>

        <div class="input-group">

            <div class="error" id="error">Please enter a valid name (letters only)</div>

        <div class="result" id="result">

            <div class="result-name" id="resultName"></div>
        </div>

        function generateWhimsicalName() {
            const input = document.getElementById('nameInput').value.trim();
            const error = document.getElementById('error');
            const result = document.getElementById('result');
            const resultName = document.getElementById('resultName');

            // Validate input
            if (!input || !/^[a-zA-Z\s]+$/.test(input)) {
                error.classList.add('show');
                result.classList.remove('show');
                return;
            }

            error.classList.remove('show');

            // Split input into words
            const words = input.split(/\s+/).filter(word => word.length > 0);

            // Generate whimsical name
            const whimsicalParts = words.map(word => {
                const prefix = word.substring(0, 2).toLowerCase();
                const dictionary = whimsicalDictionary[prefix];

                if (dictionary && dictionary.length > 0) {
                    // Pick a random word from the dictionary
                    const randomIndex = Math.floor(Math.random() * dictionary.length);
                    return dictionary[randomIndex];
                } else {
                    // Fallback: capitalize the original word if no match
                    return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
                }
            });

            // Display result
            resultName.textContent = whimsicalParts.join(' ');
            result.classList.add('show');
        }

        // Allow Enter key to submit
        document.getElementById('nameInput').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                generateWhimsicalName();
            }
        });

        // Focus input on load
        window.onload = function() {
            document.getElementById('nameInput').focus();
        };
